<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catastro - Registro de Medidores</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="glass-container">
        <h2>Registro de Catastro</h2>
        <form id="catastroForm">

            <div class="form-group">
                <label>Técnico</label>
                <select id="tecnico" required>
                    <option value="">Seleccionar Técnico</option>
                    <option value="DIAZ NORIEGA JUAN BACILIO">DIAZ NORIEGA JUAN BACILIO</option>
                    <option value="SOLORZANO CORDOVA GABRIEL CRISTIAN">SOLORZANO CORDOVA GABRIEL CRISTIAN</option>
                    <option value="LANDAVERRY MENDOZA FELIX ALFREDO">LANDAVERRY MENDOZA FELIX ALFREDO</option>
                    <option value="MELO CHUMPITAZ JAVIER JOSIMAR">MELO CHUMPITAZ JAVIER JOSIMAR</option>
                    <option value="PANDAL PALOMINO ALEXANDER JOSEPH">PANDAL PALOMINO ALEXANDER JOSEPH</option>
                    <option value="PUMACAYO VILCHEZ ALEXANDER DARWIN">PUMACAYO VILCHEZ ALEXANDER DARWIN</option>
                    <option value="ROBERTO CAYCHO SALAZAR">ROBERTO CAYCHO SALAZAR</option>
                    <option value="GARCIA MEDINA ALEJANDRO ADRIAN">GARCIA MEDINA ALEJANDRO ADRIAN</option>
                    <option value="PAUL ANDERSON CERVAN TARAZONA">PAUL ANDERSON CERVAN TARAZONA</option>
                    <option value="SANDOVAL ZAPATA ANGIE JACKELINE">SANDOVAL ZAPATA ANGIE JACKELINE</option>
                    <option value="BARRIENTOS TAPIAZA PERCY FABRIZIO">BARRIENTOS TAPIAZA PERCY FABRIZIO</option>
                    <option value="JAMPIER TOLEDO CCANCCE">JAMPIER TOLEDO CCANCCE</option>
                    <option value="LUIS FIDEL ROMERO SORALUZ">LUIS FIDEL ROMERO SORALUZ</option>
                    <option value="KENNY DANIEL VELASQUEZ QUISPE">KENNY DANIEL VELASQUEZ QUISPE</option>
                    <option value="AROON ALONZO CAJAHUAMAN MENDOZA">AROON ALONZO CAJAHUAMAN MENDOZA</option>
                    <option value="DIAZ CARRAZCO JOHAN JOSE">DIAZ CARRAZCO JOHAN JOSE</option>
                    <option value="APAZA CARI MICHAEL BENEDICTO">APAZA CARI MICHAEL BENEDICTO</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>ITM o Losa Portafusible</label>
                <select id="itm_portafusible" required>
                    <option value="">Seleccionar</option>
                    <option value="ITM">ITM</option>
                    <option value="Portafusible">Losa Portafusible</option>
                    <option value="Ninguno">Ninguno</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="suministro">Buscar Suministro</label>
                <div class="search-container">
                    <input type="number" id="suministro" placeholder="Ej. 10017" required>
                    <button type="button" id="btnBuscar">Buscar</button>
                </div>
            </div>

            <!-- Campos extraídos de la BD actualizada -->
            <div class="form-group">
                <label>Modelo Medidor</label>
                <input type="text" id="medidor" readonly placeholder="Se autocompleta con la búsqueda">
            </div>
            
            <div class="form-row">
                <div class="form-group half">
                    <label>Distrito</label>
                    <input type="text" id="distrito" readonly placeholder="Autocompletado">
                </div>
                <div class="form-group half">
                    <label>Dirección</label>
                    <input type="text" id="direccion" readonly placeholder="Autocompletado">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group half">
                    <label>Número de Medidor</label>
                    <input type="text" id="numero_medidor" readonly placeholder="Autocompletado">
                </div>
                <div class="form-group half">
                    <label>Marca</label>
                    <input type="text" id="marca" readonly placeholder="Autocompletado">
                </div>
            </div>

            <div class="form-group">
                <label>Lectura del Medidor</label>
                <input type="number" step="any" id="lectura_medidor" readonly placeholder="Autocompletado">
            </div>

            <div class="form-row">
                <div class="form-group half">
                    <label>Tipo de caja</label>
                    <select id="tipo_caja" required>
                        <option value="">Seleccionar</option>
                        <option value="LL">LL</option>
                        <option value="LR">LR</option>
                        <option value="LTR">LTR</option>
                        <option value="L">L</option>
                        <option value="LT">LT</option>
                        <option value="Embutida">Embutida</option>
                        <option value="Policarbonato">Policarbonato</option>
                        <option value="-">-</option>
                    </select>
                </div>
                <div class="form-group half">
                    <label>Tipo de chapa</label>
                    <select id="tipo_chapa" required>
                        <option value="">Seleccionar</option>
                        <option value="Triangular">Triangular</option>
                        <option value="A&G">A & G</option>
                        <option value="Triangular Policarbonato">Triangular Policarbonato</option>
                        <option value="G1">G1</option>
                        <option value="G2">G2</option>
                        <option value="G3">G3</option>
                        <option value="S1000">S1000</option>
                        <option value="-">-</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group half">
                    <label>Fase</label>
                    <select id="fase" required>
                        <option value="">Seleccionar</option>
                        <option value="MON">MON</option>
                        <option value="TRI">TRI</option>
                        <option value="-">-</option>
                    </select>
                </div>
                <div class="form-group half">
                    <label>Tipo de acometida</label>
                    <select id="tipo_acometida" required>
                        <option value="">Seleccionar</option>
                        <option value="NYY">NYY</option>
                        <option value="NKY">NKY</option>
                        <option value="Concentrica">Concentrica</option>
                        <option value="N2XY">N2XY</option>
                        <option value="Tela">Tela</option>
                        <option value="-">-</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Impedimento</label>
                <select id="impedimento" required>
                    <option value="">Seleccionar Impedimento</option>
                </select>
            </div>

            <div class="form-group" id="submotivo-group" style="display: none;">
                <label>Sub motivo</label>
                <select id="submotivo">
                    <option value="">Seleccionar Sub motivo</option>
                </select>
            </div>

            <div class="form-group">
                <label>Comentarios (Opcional)</label>
                <textarea id="comentarios" rows="3" maxlength="200" placeholder="Agrega un comentario o detalle adicional (máx. 200 caracteres)..."></textarea>
            </div>

            <div class="form-group">
                <label>Fotos (Opcional, máximo 5 por registro)</label>
                <div class="file-upload-wrapper">
                    <input type="file" id="fotos" accept="image/*" multiple class="hidden-input">
                    <label for="fotos" class="custom-file-button">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                        Tocar para Tomar o Elegir Fotos
                    </label>
                </div>
                <small id="foto-help">Subir evidencia de acometidas, estado de caja, etc.</small>
                <div id="previewContainer" class="preview-container"></div>
            </div>
            <button type="submit" id="btnGuardar">Guardar Registro</button>
        </form>
    </div>

    <!-- Contenedor para las notificaciones personalizadas -->
    <div id="custom-toast"></div>

    <script src="app.js"></script>
</body>
</html>
